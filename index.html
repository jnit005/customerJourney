<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ShopEase — Customer Journey AI Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f8fa;color:#17202a}header{background:#fff;border-bottom:1px solid #e6e8eb;position:sticky;top:0;z-index:10}.nav{max-width:1120px;margin:auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.logo{font-size:21px;font-weight:800}.logo span{color:#3867d6}.navlinks{display:flex;gap:22px}.navlinks a{color:#4b5563;text-decoration:none;font-size:14px;cursor:pointer}.navlinks a:hover{color:#3867d6}.cart{background:#17202a;color:white;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:42px 20px 110px}.hero{background:#eef3ff;border-radius:16px;padding:42px;margin-bottom:30px}.hero h1{font-size:38px;margin:0 0 10px}.hero p{color:#59636e;max-width:650px;line-height:1.6}.btn{background:#3867d6;color:white;border:0;padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:600}.section-title{display:flex;justify-content:space-between;align-items:center;margin:30px 0 15px}.section-title h2{margin:0;font-size:22px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e4e7eb;border-radius:12px;padding:18px}.product-img{height:170px;background:#eef0f3;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:54px;margin-bottom:14px}.card h3{margin:5px 0;font-size:17px}.price{font-weight:700;margin:9px 0 14px}.muted{color:#6b7280;font-size:14px;line-height:1.5}.detail{display:grid;grid-template-columns:1fr 1fr;gap:35px;background:#fff;padding:28px;border:1px solid #e4e7eb;border-radius:14px}.detail .product-img{height:330px}.detail h1{font-size:32px;margin:0 0 8px}.price.big{font-size:25px}.bullets{padding-left:18px;line-height:1.9;color:#555}.panel{background:#fff;border:1px solid #e4e7eb;border-radius:12px;padding:22px;margin-top:20px}.checkout{max-width:650px}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #d8dce1;border-radius:7px}.empty{padding:50px;text-align:center;background:#fff;border:1px solid #e4e7eb;border-radius:12px}.chat{position:fixed;right:22px;bottom:22px;width:355px;max-width:calc(100vw - 30px);background:white;border:1px solid #dfe3e8;border-radius:14px;box-shadow:0 12px 35px rgba(0,0,0,.14);z-index:20;overflow:hidden}.chathead{background:#17202a;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.chathead small{display:block;color:#cbd5e1;font-size:11px;margin-top:2px}.chatbody{height:330px;overflow:auto;padding:13px;background:#f8fafc}.msg{max-width:85%;padding:10px 12px;border-radius:11px;margin:8px 0;font-size:13px;line-height:1.45}.bot{background:white;border:1px solid #e6e8eb}.user{background:#3867d6;color:white;margin-left:auto}.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid #eee}.quick button{border:1px solid #d6dbe1;background:white;border-radius:20px;padding:6px 9px;font-size:11px;cursor:pointer}.chatinput{display:flex;border-top:1px solid #eee}.chatinput input{flex:1;border:0;padding:12px;outline:none}.chatinput button{border:0;background:#3867d6;color:#fff;padding:0 15px}.tag{display:inline-block;font-size:11px;padding:4px 7px;border-radius:10px;background:#eaf0ff;color:#3867d6;margin-bottom:12px}@media(max-width:760px){.products{grid-template-columns:1fr}.detail{grid-template-columns:1fr}.navlinks{display:none}.hero h1{font-size:29px}.chat{right:10px;bottom:10px}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">Shop<span>Ease</span></div><div class="navlinks"><a onclick="go('home')">Home</a><a onclick="go('products')">Products</a><a onclick="go('orders')">My Orders</a></div><button class="cart" onclick="go('cart')">Cart (<span id="cartCount">0</span>)</button></div></header>
<main class="wrap" id="app"></main>
<div class="chat">
 <div class="chathead"><div><b>ShopEase Assistant</b><small id="contextLabel">Context: Home</small></div><span>●</span></div>
 <div class="chatbody" id="messages"></div>
 <div class="quick" id="quick"></div>
 <div class="chatinput"><input id="input" placeholder="Ask about this page..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div>
</div>
<script>
const products=[
 {id:'headphones',name:'Wireless Headphones',price:2999,icon:'🎧',desc:'Comfortable wireless headphones with active noise cancellation.',features:['Active noise cancellation','30-hour battery','USB-C charging']},
 {id:'watch',name:'Smart Watch',price:4499,icon:'⌚',desc:'A lightweight smart watch for fitness, calls and everyday use.',features:['Heart-rate tracking','7-day battery','Water resistant']},
 {id:'speaker',name:'Bluetooth Speaker',price:1999,icon:'🔊',desc:'Compact speaker with clear sound and up to 12 hours of playback.',features:['12-hour playback','Bluetooth 5.3','Portable design']}
];
let page='home', selected=null, cart=[];
const money=n=>'₹'+n.toLocaleString('en-IN');
function go(p,id){page=p;selected=id||null;render();updateContext();}
function render(){const a=document.getElementById('app');
 if(page==='home') a.innerHTML=`<section class="hero"><span class="tag">Customer Journey AI Demo</span><h1>Everything you need, in one place.</h1><p>Browse products and use the assistant to see how page-aware support works. Try asking different questions on different pages.</p><button class="btn" onclick="go('products')">Shop products</button></section><div class="section-title"><h2>Popular products</h2><button class="btn" onclick="go('products')">View all</button></div><div class="products">${products.map(card).join('')}</div>`;
 else if(page==='products') a.innerHTML=`<div class="section-title"><h2>All products</h2><span class="muted">3 products</span></div><div class="products">${products.map(card).join('')}</div>`;
 else if(page==='detail'){const p=products.find(x=>x.id===selected);a.innerHTML=`<div class="detail"><div class="product-img">${p.icon}</div><div><span class="tag">Product page</span><h1>${p.name}</h1><p class="price big">${money(p.price)}</p><p class="muted">${p.desc}</p><ul class="bullets">${p.features.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn" onclick="add('${p.id}')">Add to cart</button></div></div>`}
 else if(page==='cart') a.innerHTML=cart.length?`<div class="section-title"><h2>Your cart</h2><span class="muted">${cart.length} item(s)</span></div>${cart.map(id=>{const p=products.find(x=>x.id===id);return `<div class="panel" style="display:flex;justify-content:space-between;align-items:center"><div><b>${p.name}</b><div class="muted">${money(p.price)}</div></div><button class="btn" onclick="go('detail','${p.id}')">View product</button></div>`}).join('')}<div class="panel"><b>Total: ${money(cart.reduce((s,id)=>s+products.find(p=>p.id===id).price,0))}</b><button class="btn" style="float:right" onclick="go('checkout')">Checkout</button></div>`:`<div class="empty"><h2>Your cart is empty</h2><p class="muted">Add a product to continue.</p><button class="btn" onclick="go('products')">Browse products</button></div>`;
 else if(page==='checkout') a.innerHTML=`<div class="checkout"><span class="tag">Checkout</span><h1>Complete your order</h1><div class="panel"><b>Shipping details</b><div class="field"><label>Full name</label><input placeholder="Your name"></div><div class="field"><label>Address</label><input placeholder="Street and city"></div><div class="field"><label>PIN code</label><input placeholder="560001"></div><button class="btn" onclick="alert('Demo order placed!')">Place order</button></div></div>`;
 else if(page==='orders') a.innerHTML=`<div class="empty"><h2>My Orders</h2><p class="muted">No orders yet. This demo page exists to show that the assistant can use navigation context too.</p></div>`;
 document.getElementById('cartCount').textContent=cart.length;
}
function card(p){return `<div class="card"><div class="product-img">${p.icon}</div><h3>${p.name}</h3><p class="muted">${p.desc}</p><div class="price">${money(p.price)}</div><button class="btn" onclick="go('detail','${p.id}')">View product</button></div>`}
function add(id){cart.push(id);document.getElementById('cartCount').textContent=cart.length;go('cart');}
function context(){if(page==='home')return {label:'Home',topic:'homepage',intro:'You are on the ShopEase home page. I can help you discover products or explain how to use the store.'};if(page==='products')return {label:'Products',topic:'product listing',intro:'You are browsing the product listing. I can compare the products or help you choose one.'};if(page==='detail'){const p=products.find(x=>x.id===selected);return {label:p.name,topic:'product detail',intro:`You are viewing ${p.name}. I can answer questions about its price, features, or help you add it to your cart.`};}if(page==='cart')return {label:'Cart',topic:'shopping cart',intro:'You are on your cart page. I can help with your selected items, total, or the next checkout step.'};if(page==='checkout')return {label:'Checkout',topic:'checkout',intro:'You are on checkout. I can help explain the shipping fields or what happens when you place the order.'};return {label:'My Orders',topic:'orders',intro:'You are on My Orders. I can help with order-related questions.'}}
function updateContext(){const c=context();document.getElementById('contextLabel').textContent='Context: '+c.label;document.getElementById('quick').innerHTML=quickFor(c.topic);document.getElementById('messages').innerHTML='';bot(c.intro)}
function quickFor(t){let qs=t==='homepage'?['What can I buy?','Help me choose']:t==='product listing'?['Compare products','Which is cheapest?']:t==='product detail'?['What are the features?','Add this to cart']:t==='shopping cart'?['What is my total?','How do I checkout?']:t==='checkout'?['What happens next?','Is shipping required?']:['Do I have any orders?'];return qs.map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}
function bot(text){const d=document.createElement('div');d.className='msg bot';d.textContent=text;document.getElementById('messages').appendChild(d);document.getElementById('messages').scrollTop=99999}
function user(text){const d=document.createElement('div');d.className='msg user';d.textContent=text;document.getElementById('messages').appendChild(d);document.getElementById('messages').scrollTop=99999}
function ask(t){document.getElementById('input').value=t;send()}
function send(){const i=document.getElementById('input'),q=i.value.trim();if(!q)return;i.value='';user(q);setTimeout(()=>bot(answer(q)),180)}
function answer(q){const x=q.toLowerCase(),c=context();
 if(c.topic==='product detail'){const p=products.find(z=>z.id===selected);if(x.includes('feature'))return `${p.name} includes: ${p.features.join(', ')}.`;if(x.includes('price')||x.includes('cost'))return `${p.name} is ${money(p.price)} on this product page.`;if(x.includes('add')){add(p.id);return `${p.name} has been added to your cart. You are now on the Cart page.`;}return `Since you're viewing ${p.name}, I can help with its features, price, or adding it to your cart.`}
 if(c.topic==='product listing'){if(x.includes('cheap'))return `The cheapest option on this page is the Bluetooth Speaker at ${money(1999)}.`;if(x.includes('compare'))return 'The Wireless Headphones are best for noise cancellation, the Smart Watch for fitness features, and the Bluetooth Speaker for portability and lower price.';return 'You are on the Products page. I can compare the three products or help you choose based on price and features.'}
 if(c.topic==='shopping cart'){if(x.includes('total'))return `Your current cart total is ${money(cart.reduce((s,id)=>s+products.find(p=>p.id===id).price,0))}.`;if(x.includes('checkout')){go('checkout');return 'I have taken you to Checkout. You can enter your shipping details there.';}return `You have ${cart.length} item(s) in your cart. I can help with the total or checkout.`}
 if(c.topic==='checkout')return 'You are at Checkout. Enter your name, address and PIN code, then select Place your order. This is only a demo.';
 if(c.topic==='orders')return 'You are on My Orders. This demo does not contain any real order history.';
 if(x.includes('choose'))return 'You are on the Home page. Open Products to compare all three items, or tell me what you are looking for.';return 'You are currently on the ShopEase Home page. I can guide you to Products, help you choose an item, or explain how this demo works.';
}
render();updateContext();
</script>
</body></html>
